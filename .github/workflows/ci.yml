name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts: n8n-workflow is a build-time dependency for types only
      # (n8n provides it at runtime), and it pulls in isolated-vm, a native module
      # whose compile step is slow and fails on some runners. Nothing here needs it.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Package contains the node, the credential and the icon
        run: |
          npm pack --dry-run --json > pack.json
          for f in dist/nodes/Ratifia/Ratifia.node.js dist/credentials/RatifiaApi.credentials.js dist/nodes/Ratifia/ratifia.svg; do
            node -e "const p=require('./pack.json')[0]; if(!p.files.some(x=>x.path==='$f')){console.error('missing from package: $f');process.exit(1)}"
          done
      - name: No runtime dependencies (required for n8n verification)
        run: node -e "const d=require('./package.json').dependencies; if(d&&Object.keys(d).length){console.error('runtime dependencies are not allowed:',d);process.exit(1)}"
